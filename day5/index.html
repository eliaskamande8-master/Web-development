<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User directory</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 40rem;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    #status[data-state="error"] { color: #b00020; }
    #status[data-state="success"] { color: #1b6e2f; }
    #users-list {
      list-style: none;
      padding: 0;
    }
    #users-list li {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
    }
    #users-list h2 {
      font-size: 1.1rem;
      margin: 0 0 0.25rem;
    }
    #users-list p {
      margin: 0;
    }
  </style>
  <script src="users.js" defer></script>
</head>
<body>
  <h1>User directory</h1>

  <div class="controls">
    <button id="load-users" type="button">Load users</button>
    <label for="filter-input">Filter by name</label>
    <input id="filter-input" type="text" autocomplete="off">
  </div>

  <p id="status" role="status"></p>

  <ul id="users-list"></ul>
</body>
</html>
