<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickNotes API client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main>
    <h1>QuickNotes</h1>
    <p class="intro">A small client that talks to the JSONPlaceholder practice API.</p>

    <button id="load-btn" type="button">Load notes</button>

    <!-- One place for loading, success and error messages -->
    <p id="status" role="status" aria-live="polite"></p>

    <!-- Notes are added here by api.js -->
    <ul id="notes-list"></ul>
  </main>
</body>
</html>
